name: Scrape apartments

on:
  # Встроенное расписание GitHub убрано — оно сейчас сильно опаздывает
  # (иногда на часы вместо минут, это известная проблема GitHub Actions
  # в 2026 году, не наш баг). Вместо него запуск дёргает внешний
  # cron-сервис (cron-job.org) через API, см. README.
  workflow_dispatch: {} # позволяет запустить вручную кнопкой в GitHub, и именно этот же триггер дёргает внешний cron-сервис

# Инцидент 19.08.2026: один прогон завис на источнике, который начал
# блокировать буквально каждый запрос (см. circuit breaker в
# run.js), и т.к. concurrency-группы не было, cron-job.org каждые
# 15 минут запускал ЕЩЁ один прогон поверх зависшего — за пару часов
# накопилось 9 параллельных зависших прогонов одновременно, и ни один
# не успевал дойти до отправки объявлений.
#
# 13.09.2026: concurrency переехала ВНУТРЬ jobs.scrape (см. ниже) и
# теперь параметризована matrix.deal_type — раньше она была здесь, на
# уровне всего workflow, одной общей группой. Так было, пока job был
# один. Теперь job'ов два (sale/rent, см. strategy.matrix ниже), и им
# нужны РАЗНЫЕ группы: если бы группа осталась общей на весь workflow,
# GitHub поставил бы job "rent" СЛЕДУЮЩЕГО триггера в очередь за job'ом
# "sale" ТЕКУЩЕГО — а это не нужно, у них нет общих данных, которые
# можно было бы задублировать. Раздельные группы дают то же самое
# исходное свойство (последующие триггеры не наслаиваются друг на
# друга), просто отдельно для sale и для rent.
jobs:
  scrape:
    strategy:
      fail-fast: false
      matrix:
        deal_type: [sale, rent]
    concurrency:
      group: scrape-apartments-${{ matrix.deal_type }}
      # cancel-in-progress: false (а не true) — следующий триггер
      # СТАВИТСЯ В ОЧЕРЕДЬ и ждёт, пока текущий прогон ЭТОГО ЖЕ
      # deal_type закончится, вместо того чтобы либо отменять его на
      # середине (true — тогда прогон, который вот-вот дошёл бы до
      # отправки, может обрываться раньше времени), либо запускаться
      # параллельно без всякого ограничения (тогда два прогона
      # одновременно видят одно и то же новое объявление, оба считают
      # его новым через isKnown() и оба шлют уведомление в Telegram —
      # дубли). Очередь защищает от обеих проблем разом.
      #
      # Если прогоны регулярно не укладываются в 15 минут между
      # триггерами cron-job.org — планово, не из-за зависания — то
      # очередь начнёт копиться и уведомления будут запаздывать. В
      # этом случае лечить нужно интервал на cron-job.org (увеличить)
      # или причину медлительности (напр. частые фолбэки AI-цепочки
      # при нестабильном Gemini — см. LLM_EXTRACT_DELAY_MS в run.js),
      # а не эту настройку.
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Ограничение по времени вместе с cancel-in-progress: false (очередь
    # выше) — если прогон всё-таки зависнет (напр. источник снова начнёт
    # блокировать каждый запрос до срабатывания circuit breaker), он
    # сам оборвётся вместо того, чтобы висеть часами и блокировать всю
    # очередь следующих триггеров cron-job.org.
    # 19.08.2026: поднято с 12 до 20 минут.
    # 13.09.2026: поднято с 20 до 40, и одновременно job разделён на 2
    # параллельных (matrix sale/rent, см. выше) — раньше один job
    # последовательно обходил ВСЕ 30 комбинаций source×propertyType×
    # dealType и при большом числе новых объявлений не успевал дойти
    # до аренды/поздних источников за 20 минут. Теперь каждый job
    # обходит только свою половину (15 комбинаций), и у каждого свои
    # отдельные 40 минут параллельно с другим — совокупный бюджет
    # вырос не в 2, а примерно в 4 раза относительно исходных 20 минут
    # на всё. Отдельно снижена и сама причина медлительности —
    # LLM_EXTRACT_DELAY_MS в run.js — так что 40 минут это по-прежнему
    # страховка на всплеск нагрузки, а не компенсация проблемы одним
    # лимитом.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Установка зависимостей
        run: npm install

      - name: Запуск проверки (${{ matrix.deal_type }})
        run: node src/run.js
        env:
          # Ограничивает main() в run.js только этим типом сделки —
          # см. DEAL_TYPE_FILTER/RUN_SALE/RUN_RENT там же. Намеренно
          # делим по dealType, а не по источнику: кросс-source дедуп
          # (makeEntityKey) остаётся надёжным только если для ОДНОГО
          # dealType источники по-прежнему обходятся строго
          # последовательно одним процессом — что здесь и происходит,
          # просто sale и rent теперь как раз эти два процесса.
          DEAL_TYPE_FILTER: ${{ matrix.deal_type }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_APARTMENT: ${{ secrets.TELEGRAM_GROUP_APARTMENT }}
          TELEGRAM_GROUP_APARTMENT_RENT: ${{ secrets.TELEGRAM_GROUP_APARTMENT_RENT }}
          TELEGRAM_GROUP_COMMERCIAL: ${{ secrets.TELEGRAM_GROUP_COMMERCIAL }}
          TELEGRAM_GROUP_COMMERCIAL_RENT: ${{ secrets.TELEGRAM_GROUP_COMMERCIAL_RENT }}
          TELEGRAM_GROUP_HOUSE: ${{ secrets.TELEGRAM_GROUP_HOUSE }}
          USE_AI_CLASSIFICATION: ${{ secrets.USE_AI_CLASSIFICATION }}
          # ИИ в скрапере выключен (USE_AI_EXTRACTION не задан = false): разбор
          # объявлений идёт regex-парсером, ИИ работает только в поиске (Vercel).
          # Чтобы включить ИИ-разбор обратно, добавьте сюда:
          #   USE_AI_EXTRACTION: "true"
          #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          #   AI_FALLBACK_ENABLED: "true"
          #   MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Опционально: http://user:pass@host:port резидентного/мобильного
          # прокси для запросов к OLX (см. src/http.js). Если секрет не
          # задан в репозитории — переменная просто пустая, и код работает
          # как раньше, напрямую с IP GitHub Actions runner'а.
          OLX_PROXY_URL: ${{ secrets.OLX_PROXY_URL }}
