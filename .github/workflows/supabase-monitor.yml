name: Supabase activity monitor

on:
  schedule:
    # Three real Data API requests each day, away from the top of the hour.
    - cron: '17 6,14,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-monitor
  cancel-in-progress: false

jobs:
  check-database:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query Supabase listings with bounded retries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: node .github/scripts/supabase-health-check.mjs
